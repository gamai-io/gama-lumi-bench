name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 det_router_bench.py --selftest
      - run: python3 embed_qdrant_bench.py --selftest
      - run: python3 retrieval_eval.py --selftest
      - run: python3 -m unittest discover -s tests -v
      - run: pip install aiohttp && python3 bench_v2/run_bench.py --selftest
